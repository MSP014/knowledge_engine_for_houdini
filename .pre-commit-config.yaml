# Pre-commit Guardrails - KEH (Knowledge Engine for Houdini)
# Environment: keh-env
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=10240']

  - repo: local
    hooks:
      - id: black
        name: black
        entry: conda run -n keh-env python -m black
        language: system
        types: [python]

      - id: isort
        name: isort
        entry: conda run -n keh-env python -m isort
        language: system
        types: [python]

      - id: flake8
        name: flake8
        entry: conda run -n keh-env python -m flake8
        language: system
        types: [python]
        args: ['--ignore=E501,W503', '--max-line-length=88']

      - id: bandit
        name: bandit
        entry: conda run -n keh-env python -m bandit
        language: system
        types: [python]
        args: ["-r", "src", "tools"]
        exclude: "tests/"

      # PIP AUDIT (Optimised)
      # Tech Debt: Ignoring identified CVEs to allow transition to keh-env
      - id: pip-audit
        name: pip-audit
        entry: conda run -n keh-env python -m pip_audit --desc=off --progress-spinner=off --ignore-vuln CVE-2026-1703 --ignore-vuln CVE-2026-32274 --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2025-71176 --ignore-vuln CVE-2026-28684 --ignore-vuln CVE-2026-25645
        language: system
        pass_filenames: false
        always_run: true

      # Tests
      - id: pytest
        name: pytest
        entry: conda run -n keh-env python -m pytest
        language: system
        pass_filenames: false
        always_run: true
